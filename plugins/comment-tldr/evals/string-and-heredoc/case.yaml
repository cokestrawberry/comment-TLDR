schema_version: "1.1"
name: string-and-heredoc
description: >-
  Comment-shaped lines inside a heredoc body and a string stay as written, while the shell comment
  above them is rewritten
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: /comment-tldr setup.sh
graders:
  - name: heredoc-intact
    type: regex
    pattern: >-
      <<'TOML'\n# Default settings for the tool\.\n# Each key below can be overridden by an
      environment variable of the\n# same name in upper case, such as TOOL_RETRIES for retries\.
      These\n# values were picked in the 2024 tuning review after comparing them\n# with the
      defaults of two other tools\.\nretries = 3\n
    target:
      source: file
      path: setup.sh
  - name: string-intact
    type: regex
    pattern: >-
      header='// Generated by setup\.sh; edit config\.toml instead\.\n// The build reads this
      header to tell generated files apart from\n// hand-written ones, so keep its first line
      unchanged\. The marker was\n// chosen in the 2023 build review over a separate manifest
      file,\n// which kept going out of sync with the sources\.'\n
    target:
      source: file
      path: setup.sh
  - name: comment-rewritten
    type: regex
    pattern: release planning
    match: not_contains
    target:
      source: file
      path: setup.sh
