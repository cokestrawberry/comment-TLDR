schema_version: "1.1"
name: hangul-width
description: >-
  A Korean comment is rewritten within 100 columns, counting each Hangul syllable as 2 columns
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: /comment-tldr profiles.py
graders:
  # Counting Hangul syllables as 2 columns, branch k matches a line with k or more of them and
  # 101 - k or more characters, so the pattern finds exactly the lines over 100 columns.
  - name: within-100-columns
    type: regex
    pattern: "^(?:.{101}\
      |(?=(?:[^가-힣\n]*[가-힣]){1}).{100}\
      |(?=(?:[^가-힣\n]*[가-힣]){2}).{99}\
      |(?=(?:[^가-힣\n]*[가-힣]){3}).{98}\
      |(?=(?:[^가-힣\n]*[가-힣]){4}).{97}\
      |(?=(?:[^가-힣\n]*[가-힣]){5}).{96}\
      |(?=(?:[^가-힣\n]*[가-힣]){6}).{95}\
      |(?=(?:[^가-힣\n]*[가-힣]){7}).{94}\
      |(?=(?:[^가-힣\n]*[가-힣]){8}).{93}\
      |(?=(?:[^가-힣\n]*[가-힣]){9}).{92}\
      |(?=(?:[^가-힣\n]*[가-힣]){10}).{91}\
      |(?=(?:[^가-힣\n]*[가-힣]){11}).{90}\
      |(?=(?:[^가-힣\n]*[가-힣]){12}).{89}\
      |(?=(?:[^가-힣\n]*[가-힣]){13}).{88}\
      |(?=(?:[^가-힣\n]*[가-힣]){14}).{87}\
      |(?=(?:[^가-힣\n]*[가-힣]){15}).{86}\
      |(?=(?:[^가-힣\n]*[가-힣]){16}).{85}\
      |(?=(?:[^가-힣\n]*[가-힣]){17}).{84}\
      |(?=(?:[^가-힣\n]*[가-힣]){18}).{83}\
      |(?=(?:[^가-힣\n]*[가-힣]){19}).{82}\
      |(?=(?:[^가-힣\n]*[가-힣]){20}).{81}\
      |(?=(?:[^가-힣\n]*[가-힣]){21}).{80}\
      |(?=(?:[^가-힣\n]*[가-힣]){22}).{79}\
      |(?=(?:[^가-힣\n]*[가-힣]){23}).{78}\
      |(?=(?:[^가-힣\n]*[가-힣]){24}).{77}\
      |(?=(?:[^가-힣\n]*[가-힣]){25}).{76}\
      |(?=(?:[^가-힣\n]*[가-힣]){26}).{75}\
      |(?=(?:[^가-힣\n]*[가-힣]){27}).{74}\
      |(?=(?:[^가-힣\n]*[가-힣]){28}).{73}\
      |(?=(?:[^가-힣\n]*[가-힣]){29}).{72}\
      |(?=(?:[^가-힣\n]*[가-힣]){30}).{71}\
      |(?=(?:[^가-힣\n]*[가-힣]){31}).{70}\
      |(?=(?:[^가-힣\n]*[가-힣]){32}).{69}\
      |(?=(?:[^가-힣\n]*[가-힣]){33}).{68}\
      |(?=(?:[^가-힣\n]*[가-힣]){34}).{67}\
      |(?=(?:[^가-힣\n]*[가-힣]){35}).{66}\
      |(?=(?:[^가-힣\n]*[가-힣]){36}).{65}\
      |(?=(?:[^가-힣\n]*[가-힣]){37}).{64}\
      |(?=(?:[^가-힣\n]*[가-힣]){38}).{63}\
      |(?=(?:[^가-힣\n]*[가-힣]){39}).{62}\
      |(?=(?:[^가-힣\n]*[가-힣]){40}).{61}\
      |(?=(?:[^가-힣\n]*[가-힣]){41}).{60}\
      |(?=(?:[^가-힣\n]*[가-힣]){42}).{59}\
      |(?=(?:[^가-힣\n]*[가-힣]){43}).{58}\
      |(?=(?:[^가-힣\n]*[가-힣]){44}).{57}\
      |(?=(?:[^가-힣\n]*[가-힣]){45}).{56}\
      |(?=(?:[^가-힣\n]*[가-힣]){46}).{55}\
      |(?=(?:[^가-힣\n]*[가-힣]){47}).{54}\
      |(?=(?:[^가-힣\n]*[가-힣]){48}).{53}\
      |(?=(?:[^가-힣\n]*[가-힣]){49}).{52}\
      |(?=(?:[^가-힣\n]*[가-힣]){50}).{51})"
    flags: m
    match: not_contains
    target:
      source: file
      path: profiles.py
  - name: comment-rewritten
    type: regex
    pattern: 2025년 동기화 검토 회의
    match: not_contains
    target:
      source: file
      path: profiles.py
