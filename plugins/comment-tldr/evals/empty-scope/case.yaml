schema_version: "1.1"
name: empty-scope
description: Called without a scope, the skill rewrites the long comments in every tracked file
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: /comment-tldr
graders:
  - name: top-level-file-rewritten
    type: regex
    pattern: 2025 pricing review
    match: not_contains
    target:
      source: file
      path: server.py
  - name: nested-file-rewritten
    type: regex
    pattern: 2024 operations review
    match: not_contains
    target:
      source: file
      path: tools/cleanup.py
