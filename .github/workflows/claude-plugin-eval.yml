name: claude-plugin-eval

on:
  workflow_dispatch:

jobs:
  claude-plugin-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm install -g @anthropic-ai/claude-code@2.1.287
      - run: |
          claude plugin eval plugins/comment-tldr --scaffold --ablation none --no-publish \
            --allow-tools Edit --model claude-opus-5-5 --trust-plugin
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
