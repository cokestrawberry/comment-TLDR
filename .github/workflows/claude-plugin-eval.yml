name: claude-plugin-eval

on:
  workflow_dispatch:

jobs:
  claude-plugin-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm install -g @anthropic-ai/claude-code@2.1.287
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat
      # Ubuntu 24.04's default AppArmor policy stops bubblewrap from creating user namespaces.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: |
          claude plugin eval plugins/comment-tldr --scaffold --ablation none --no-publish \
            --allow-tools Edit "Bash(git *)" --model claude-opus-5-5 --trust-plugin
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
